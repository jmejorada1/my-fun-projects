spring:
  application:
    name: posts
  datasource:
    url: jdbc:postgresql://localhost:5432/posts-db
    username: postgres
    password: "P@55w0rd"
    hikari:
      schema: posts
  flyway:
    schemas: posts
    default-schema: posts
    create-schemas: true
  jpa:
    properties:
      hibernate:
        default_schema: posts
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        # The framework max of 2000 would mean 2000-element IN lists on /resources.
        default-page-size: 20
        max-page-size: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  server:
    # Never published or routed, so only in-network Prometheus reaches it. That is its only
    # protection: Spring Security doesn't cover a separate management port. Don't bind
    # 127.0.0.1, which would block the Prometheus container too.
    port: 8081
  endpoints:
    web:
      exposure:
        # Never add env/beans/heapdump/threaddump: they leak secrets and this port has no auth.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        # Exposes /actuator/health/liveness and /readiness outside Kubernetes too.
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Buckets, not in-process percentiles, so histogram_quantile() aggregates across instances.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,400ms,800ms,1s,2s,5s

app:
  cors:
    # Comma-separated (docs/architecture.md §9.2). Docker overrides it with APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: http://localhost:4200
