# Configuration for import_bigotry_data.py.
# Any value here can be overridden per-run with the matching CLI flag,
# e.g. `python3 import_bigotry_data.py --start-row 1 --end-row 500`.

# The bundled 5000-row sample. For the full dataset, see README.md's
# "Importing the full IMDB dataset".
tsv_path: sample-data/title.basics.sample.tsv

# Inclusive, 1-indexed data rows (the header doesn't count).
start_row: 1
end_row: 5000

# Seeded by V14__seed_imdb_bigotry_domain.sql.
domain: imdb/bigotry

# Posts plus replies.
total_posts: 600

reply_fraction: 0.3

# Share of total_posts for user1/user2/user3.
user_weights: [1, 2, 3]

# Share flagged racism/sexism/lgbtq-phobic (severity 1-5); the rest get no-bigotry.
flag_probability: 0.25

# Must match backend/posts/src/main/resources/application.yml.
db_host: localhost
db_port: 5432
db_name: posts-db
db_schema: posts
db_user: postgres
db_password: "P@55w0rd"
