services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: posts-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@55w0rd}
    ports:
      # Published on 5433, not 5432 — a local Postgres install (e.g. one
      # pgAdmin is pointed at) commonly already owns 5432 on the host. The
      # `posts` service still reaches this container over the internal
      # Docker network on its actual 5432, unaffected by this mapping.
      # Connect an external client (pgAdmin, psql) to localhost:5433 if
      # you want to inspect the containerized DB.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d posts-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  posts:
    build:
      context: ./backend/posts
    environment:
      # Spring Boot's relaxed env binding overrides application.yml's
      # datasource block — no code or config-file change needed to point
      # it at the "postgres" service instead of localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/posts-db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-P@55w0rd}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/imdb-ui-angular
    ports:
      # Must stay 4200 on the host: posts' application.yml hardcodes
      # app.cors.allowed-origins to http://localhost:4200.
      - "4200:80"
    depends_on:
      - posts

  # One-off data-load job, not a long-running service — excluded from
  # `docker compose up` via the "tools" profile. Self-contained by default:
  # config.yaml's tsv_path points at the sample dataset baked into the
  # image (backend/imdb-data-python/sample-data/), and its default
  # start_row/end_row (1-5000) covers that entire sample. Run explicitly,
  # e.g. to import just a subset:
  #   docker compose run --rm imdb-loader --start-row 1 --end-row 1000
  #
  # To import the real, full title.basics.tsv instead (after downloading
  # it into backend/imdb-data-python/ — see README's "Loading IMDB data"),
  # bind-mount it in ad hoc and point --tsv-path at it:
  #   docker compose run --rm -v "$(pwd)/backend/imdb-data-python/title.basics.tsv:/app/full-title.basics.tsv:ro" \
  #     imdb-loader --tsv-path /app/full-title.basics.tsv --start-row 1 --end-row 50000
  imdb-loader:
    build:
      context: ./backend/imdb-data-python
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  # Seeds imdb/bigotry with resources (the entire 5000-row bundled sample
  # by default) plus mock users/posts/replies/flags for local testing. Same
  # image as imdb-loader, different entrypoint. Self-contained by default
  # (see imdb-loader above) — no IMDB download needed. Run explicitly, e.g.:
  #   docker compose run --rm bigotry-loader --total-posts 1000
  #
  # To seed from the real, full title.basics.tsv instead, bind-mount it ad
  # hoc the same way as imdb-loader above, pointing --tsv-path at it.
  bigotry-loader:
    build:
      context: ./backend/imdb-data-python
    entrypoint: ["python3", "import_bigotry_data.py", "--db-host", "postgres", "--db-port", "5432"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres-data:
