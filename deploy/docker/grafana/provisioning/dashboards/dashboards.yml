# Points Grafana at ./dashboards (this same directory) for dashboard JSON
# to auto-load on start — see posts-overview.json next to this file.
apiVersion: 1

providers:
  - name: posts
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
