# Auto-provisioned on Grafana container start — no manual "Add data
# source" click-through needed. `uid: prometheus` is fixed on purpose so
# dashboards/posts-overview.json can reference it deterministically
# instead of a Grafana-generated one.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
