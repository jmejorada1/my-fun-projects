apiVersion: v1
kind: Service
metadata:
  name: posts
  labels:
    app.kubernetes.io/name: posts
spec:
  selector:
    app.kubernetes.io/name: posts
  ports:
    - name: http
      port: 8080
      targetPort: http
    # Scraped by Prometheus in-cluster only. The HTTPRoute never routes it.
    - name: management
      port: 8081
      targetPort: management
