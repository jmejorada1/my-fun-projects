apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts
  labels:
    app.kubernetes.io/name: posts
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: posts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posts
    spec:
      # Mirrors compose's depends_on: condition: service_healthy, so posts
      # doesn't crash-loop while Postgres is still starting.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: posts
          image: imdb/posts
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            # Spring relaxed binding, the same mechanism docker-compose.yml uses.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/posts-db
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            # The Gateway routes /api here unchanged, so the app serves under
            # /api (spec §8.3). The management port (8081) isn't affected.
            - name: SERVER_SERVLET_CONTEXTPATH
              value: /api
            # Overridden from .env FRONTEND_PORT by the overlay's generated patch.
            - name: APP_CORS_ALLOWED_ORIGINS
              value: http://localhost:4200
          # All probes on the management port; readiness implies Flyway is done.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36   # 3 min for JVM start + Flyway
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001          # the image's `spring` user
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
