<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="my-fun-projects — built purely for fun">
  <defs>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5f6d"/>
      <stop offset="25%" stop-color="#ffc371"/>
      <stop offset="50%" stop-color="#3bd6c6"/>
      <stop offset="75%" stop-color="#5b7bff"/>
      <stop offset="100%" stop-color="#c86dd7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- confetti -->
  <g opacity="0.85">
    <circle cx="48" cy="38" r="6" fill="#ff5f6d"/>
    <circle cx="92" cy="80" r="4" fill="#ffc371"/>
    <circle cx="40" cy="150" r="5" fill="#3bd6c6"/>
    <circle cx="120" cy="180" r="3.5" fill="#5b7bff"/>
    <rect x="70" y="30" width="8" height="8" fill="#c86dd7" transform="rotate(20 70 30)"/>
    <rect x="30" y="100" width="7" height="7" fill="#3bd6c6" transform="rotate(-15 30 100)"/>

    <circle cx="852" cy="40" r="6" fill="#5b7bff"/>
    <circle cx="810" cy="85" r="4" fill="#ff5f6d"/>
    <circle cx="860" cy="150" r="5" fill="#ffc371"/>
    <circle cx="800" cy="180" r="3.5" fill="#c86dd7"/>
    <rect x="825" y="30" width="8" height="8" fill="#3bd6c6" transform="rotate(20 825 30)"/>
    <rect x="865" y="100" width="7" height="7" fill="#ff5f6d" transform="rotate(-15 865 100)"/>
  </g>

  <text x="50%" y="108" text-anchor="middle"
        font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif"
        font-size="78" font-weight="800" letter-spacing="1"
        fill="url(#title-grad)">my-fun-projects</text>
  <text x="50%" y="108" text-anchor="middle"
        font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif"
        font-size="78" font-weight="800" letter-spacing="1"
        fill="url(#glow)">my-fun-projects</text>

  <text x="50%" y="160" text-anchor="middle"
        font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif"
        font-size="26" font-weight="600"
        fill="#8a8fa3">✨ built purely for the fun of it ✨</text>
</svg>
