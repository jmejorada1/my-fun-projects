server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html isn't content-hashed and references whichever hashed JS/CSS
    # filenames the last build produced — no-cache forces revalidation on
    # every request so a redeploy shows up on a plain refresh, not just a
    # hard refresh (nginx sent no Cache-Control at all before this, so
    # browsers fell back to heuristic caching and could serve a stale
    # index.html pointing at old, no-longer-served chunk filenames).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Angular's build output content-hashes these filenames (main-<hash>.js,
    # chunk-<hash>.js, styles-<hash>.css) — any code change produces a new
    # filename, so it's safe to cache these indefinitely.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Angular's client-side router owns any path that isn't a real static
    # file — fall back to index.html instead of letting nginx 404 it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
