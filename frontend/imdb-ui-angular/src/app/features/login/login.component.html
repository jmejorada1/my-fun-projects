<main class="login">
  
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="username">Username</label>
    <input id="username" type="text" formControlName="username" placeholder="your username" autocomplete="username" />

    @if (username.invalid && username.touched) {
      <p class="field-error">Enter your username.</p>
    }
    @if (errorMessage()) {
      <p class="field-error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="switch-link">New here? <a routerLink="/register">Register</a></p>
</main>
