<main class="register">
  @if (currentDomain(); as domain) {
    <h1>{{ domain.label }}</h1>
  }
  <p class="subtitle">Create an account.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="username">Username</label>
    <input id="username" type="text" formControlName="username" placeholder="choose a username" autocomplete="username" />
    @if (username.invalid && username.touched) {
      <p class="field-error">Choose a username.</p>
    }

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
    @if (email.invalid && email.touched) {
      <p class="field-error">Enter a valid email address.</p>
    }

    @if (errorMessage()) {
      <p class="field-error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Registering…' : 'Register' }}
    </button>
  </form>

  <p class="switch-link">Already have an account? <a routerLink="/login">Log in</a></p>
</main>
