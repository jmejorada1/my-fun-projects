<header class="app-toolbar">
  <span class="brand-name">{{ activeDomainConfig().label }}</span>

  @if (currentUser()) {
    @if (showBackToTop()) {
      <button type="button" class="back-to-top" (click)="scrollToTop()">
        <span aria-hidden="true">↑</span> Back to top
      </button>
    }
    <form class="search-form" [formGroup]="searchForm" (ngSubmit)="submitSearch()">
      <input type="text" name="search-term" formControlName="term" placeholder="Search movies…" />
      <button type="submit">Search</button>
    </form>
  }

  <div class="right-group">
    <label class="domain-picker">
      Domain:
      <select name="domain" [value]="selectedDomain()" (change)="onDomainChange($event)">
        @for (option of domainOptions; track option.value) {
          <option [value]="option.value" [disabled]="!option.enabled">
            {{ option.label }}{{ option.enabled ? '' : ' (coming soon)' }}
          </option>
        }
      </select>
    </label>

    @if (currentUser(); as user) {
      <div class="user-status">
        <span>Hi {{ user.username }}</span>
        <button type="button" class="link-button" (click)="logout()">Logout</button>
      </div>
    }
  </div>
</header>
